# Прод: один сервис `bot` — БД и Caddy общие для сервера (~/server-infra/db,
# ~/server-infra/edge), этот файл их не поднимает, только подключается к их
# внешним сетям edge/db-net. Паттерн 1:1 из bots-platform. Образ собирается
# на самом VPS деплой-скриптом, не этим compose-файлом.
services:
  bot:
    container_name: police-clever-bot
    restart: unless-stopped
    image: ${BOT_IMAGE:-police-clever:prod}
    env_file:
      - path: ./.env
        required: false
    environment:
      # Общий Postgres в ~/server-infra/db — контейнер `postgres`, роль/база
      # police (см. deploy: `CREATE USER police; CREATE DATABASE police OWNER police;`).
      DATABASE_URL: postgresql://police:${POLICE_DB_PASSWORD}@postgres:5432/police
    expose:
      - "3000"
    networks:
      - edge
      - db-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  edge:
    external: true
  db-net:
    external: true
